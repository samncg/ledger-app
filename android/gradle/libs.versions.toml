[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
datastore = "1.2.1"
kotlinxSerialization = "1.9.0"
firebaseBom = "35.0.0"
biometric = "1.1.0"
work = "2.12.0"
