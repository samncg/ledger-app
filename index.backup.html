  const[autoType,setAutoType]=useState("expense");
  const[autoAmount,setAutoAmount]=useState("");
  const[autoCat,setAutoCat]=useState("food");
  const[autoNote,setAutoNote]=useState("");
  const[autoFreq,setAutoFreq]=useState("monthly");
  const[autoStart,setAutoStart]=useState(()=>todayKey());
  const[showDrawer,setShowDrawer]=useState(false);
  const[drawerTab,setDrawerTab]=useState("theme");
  const[showCmd,setShowCmd]=useState(false);
  const[toast,setToast]=useState(null);
  const[confirm,setConfirm]=useState(null);
  const[scrolled,setScrolled]=useState(false);
  const[authUser,setAuthUser]=useState(null);
  const[syncError,setSyncError]=useState(false);
  const[syncErrorMsg,setSyncErrorMsg]=useState("");
  const[lastSyncedAt,setLastSyncedAt]=useState(0);

  const prefsRef=useRef(prefs);useEffect(()=>{prefsRef.current=prefs},[prefs]);
  const pushTimerRef=useRef(null);
  const syncedRef=useRef(null);

  const[amount,setAmount]=useState("");
  const[selCats,setSelCats]=useState(["food"]);
  const category=selCats[0]||"food";
  const toggleSelCat=id=>setSelCats(prev=>prev.includes(id)?(prev.length>1?prev.filter(x=>x!==id):prev):[...prev,id]);
  const[note,setNote]=useState("");
  const[entryDate,setEntryDate]=useState(()=>todayKey());
  const[editingId,setEditingId]=useState(null);
  const fileInputRef=useRef(null);
  const addFormRef=useRef(null);

  const[draftBudget,setDraftBudget]=useState("");
  const[draftDays,setDraftDays]=useState(()=>String(daysInMonth()));
  const[draftStartDate,setDraftStartDate]=useState(()=>firstOfMonthKey());
  const[draftCurrency,setDraftCurrency]=useState("MYR");
  const[draftBalance,setDraftBalance]=useState("");

  const[newCatName,setNewCatName]=useState("");
  const[newCatGlyph,setNewCatGlyph]=useState("★");
  const[lastAction,setLastAction]=useState(null); // for undo
  const[draftFontName,setDraftFontName]=useState("");

  const today=todayKey();
  const cur=prefs.currency||"MYR";
  const balancesOn=prefs.balancesEnabled!==false;
  const heroMode=balancesOn?(prefs.heroMode==='balance'?'balance':'daily'):'daily';
  const MYR=useCallback(n=>fmt(n,cur),[cur]);

  const cats=useMemo(()=>categories.map(c=>({...c,color:theme.catColors[c.id]||'#7c8896'})),[categories,theme]);

  useEffect(()=>{document.body.style.background=theme.bg;document.body.style.color=theme.text},[theme]);
  useEffect(()=>{
    const onScroll=()=>setScrolled(window.scrollY>16);
    window.addEventListener('scroll',onScroll,{passive:true});
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  const showToast=useCallback((msg,type='info',action=null)=>{
    const id=Date.now();
    setToast({msg,type,id,action});
    setTimeout(()=>setToast(t=>t&&t.id===id?null:t),action?6000:3500);
  },[]);

  const persistExpenses=useCallback(n=>{setExpenses(n);store.set("ledger-expenses",n)},[]);
  const persistSettings=useCallback(n=>{setSettings(n);store.set("ledger-settings",n)},[]);
  const persistTheme=useCallback(n=>{setTheme(n);store.set("ledger-theme",n)},[]);
  const[savedTheme,setSavedTheme]=useState(()=>store.get("ledger-theme-saved")||null);
  const persistSavedTheme=useCallback(n=>{setSavedTheme(n);store.set("ledger-theme-saved",n)},[]);
  const persistCats=useCallback(n=>{setCategories(n);store.set("ledger-cats",n)},[]);
  const persistPrefs=useCallback(n=>{
    setPrefs(n);
    const ok=store.set("ledger-prefs",n);
    if(!ok)showToast("Storage limit reached — this change works now but won't be saved after reload. Try a smaller file.","error");
  },[showToast]);
  const persistCatBudgets=useCallback(n=>{setCatBudgets(n);store.set("ledger-catbudgets",n)},[]);
  const persistTopUps=useCallback(n=>{setTopUps(n);store.set("ledger-topups",n)},[]);
  const persistBalance=useCallback(n=>{setBalance(n);store.set("ledger-balance",n)},[]);
  const persistPiggy=useCallback(n=>{setPiggy(n);store.set("ledger-piggy",n)},[]);
  const persistRecurring=useCallback(n=>{setRecurring(n);store.set("ledger-recurring",n)},[]);

  /* ─── Cloud sync (Firebase + Google Auth) ─── */
  const stateRef=useRef(null);
  useEffect(()=>{stateRef.current={expenses,topUps,balance,piggy,recurring,settings,categories,catBudgets,prefs,theme}},[expenses,topUps,balance,piggy,recurring,settings,categories,catBudgets,prefs,theme]);
  const savedThemeRef=useRef(savedTheme);useEffect(()=>{savedThemeRef.current=savedTheme},[savedTheme]);
  const skipNextPushRef=useRef(false);

  /* Apply a cloud copy to local state (and localStorage, so it survives offline).
     Every field is shape-checked so a stale or malformed cloud doc can never
     crash the renderer or clobber the local setup with defaults. */
  const applyRemote=useCallback(data=>{
    try{
      if(Array.isArray(data.expenses)&&data.expenses.every(e=>e&&typeof e.amount==='number'&&typeof e.date==='string')){setExpenses(data.expenses);store.set("ledger-expenses",data.expenses)}
      if(Array.isArray(data.topUps)&&data.topUps.every(t=>t&&typeof t.amount==='number'&&typeof t.date==='string')){setTopUps(data.topUps);store.set("ledger-topups",data.topUps)}
      if(data.balance&&typeof data.balance==='object'&&!Array.isArray(data.balance)&&typeof data.balance.start==='number'){setBalance(data.balance);store.set("ledger-balance",data.balance)}
      if(data.piggy&&typeof data.piggy==='object'&&!Array.isArray(data.piggy)&&typeof data.piggy.target==='number'&&typeof data.piggy.saved==='number'){setPiggy(data.piggy);store.set("ledger-piggy",data.piggy)}
      if(Array.isArray(data.recurring)&&data.recurring.every(r=>r&&typeof r.amount==='number'&&typeof r.type==='string')){setRecurring(data.recurring);store.set("ledger-recurring",data.recurring)}
      if(data.settings&&typeof data.settings==='object'&&!Array.isArray(data.settings)&&typeof data.settings.monthlyBudget==='number'&&typeof data.settings.periodDays==='number'&&typeof data.settings.startDate==='string'){setSettings(data.settings);store.set("ledger-settings",data.settings)}
      if(Array.isArray(data.cats)&&data.cats.every(c=>c&&typeof c.id==='string'&&typeof c.label==='string')){setCategories(data.cats);store.set("ledger-cats",data.cats)}
      if(data.catBudgets&&typeof data.catBudgets==='object'&&!Array.isArray(data.catBudgets)){setCatBudgets(data.catBudgets);store.set("ledger-catbudgets",data.catBudgets)}
      if(data.prefs&&typeof data.prefs==='object'&&!Array.isArray(data.prefs)){
        const next={...PREF_DEFAULTS,...prefsRef.current};
        for(const k of Object.keys(data.prefs)){
          if(k==='customFonts'||k==='cardOrder'){if(Array.isArray(data.prefs[k]))next[k]=data.prefs[k]}
          else if(k==='compact'||k==='groupHistory'||k==='catEnabled')next[k]=!!data.prefs[k]
          else if(k==='heroMode')next[k]=data.prefs[k]==='balance'?'balance':'daily'
          else if(k==='balancesEnabled')next[k]=!!data.prefs[k]
          else if(k==='piggySound')next[k]=!!data.prefs[k]
          else if(k==='wallpaper'||k==='wallpaperDim'||k==='wallBlur'||k==='cardPanel'||k==='cardPanelOpacity'||k==='piggyTexture'||k==='piggySoundCustom'){/* device-local — never apply from the cloud */}
          else next[k]=data.prefs[k];
        }
        for(const k of ['pieThickness','pieGap','uiBlur','uiOpacity','wallBlur','cardPanelOpacity','wallpaperDim','weatherSpeed']){
          const n=parseFloat(next[k]);if(isFinite(n))next[k]=n;
        }
        setPrefs(next);store.set("ledger-prefs",next);
        (next.customFonts||[]).forEach(f=>{if(f&&f.name)loadGoogleFont(f.name)});
      }
      if(data.theme&&typeof data.theme==='object'&&!Array.isArray(data.theme)){
        const next={...DEFAULT_THEME,...data.theme};
        if(typeof next.bg==='string'&&typeof next.surface==='string'&&typeof next.text==='string'){setTheme(next);store.set("ledger-theme",next)}
      }
      if(data.savedTheme!==undefined&&(data.savedTheme===null||(typeof data.savedTheme==='object'&&!Array.isArray(data.savedTheme)))){setSavedTheme(data.savedTheme);store.set("ledger-theme-saved",data.savedTheme)}
    }catch(e){console.warn("applyRemote failed:",e)}
  },[]);

  /* Push only when the synced state actually differs from the last successful
     push — a byte-level comparison means no-op echoes and re-renders never
     write to Firestore. */
  const lastPushedJsonRef=useRef(null);
  const pushSync=useCallback(uid=>{
    try{
      if(!FIREBASE_CONFIGURED||!fbFS||!uid)return;
      const s=stateRef.current||{};
      const payload={
        expenses:firestoreSafe(s.expenses||[]),
        topUps:firestoreSafe(s.topUps||[]),
        balance:firestoreSafe(s.balance||{start:0}),
        piggy:firestoreSafe(s.piggy||{target:0,saved:0}),
        recurring:firestoreSafe(s.recurring||[]),
        settings:firestoreSafe(s.settings||null),
        cats:firestoreSafe(s.categories||DEFAULT_CATS),
        catBudgets:firestoreSafe(s.catBudgets||{}),
        prefs:firestoreSafe(sanitizePrefs(s.prefs||{})),
        theme:firestoreSafe(s.theme||{}),
        savedTheme:firestoreSafe(savedThemeRef.current),
      };
      const json=JSON.stringify(payload);
      if(json===lastPushedJsonRef.current)return; // nothing changed since the last write — skip
      lastPushedJsonRef.current=json;
      // Server timestamps keep ordering consistent across devices (client clocks can drift).
      // NOTE: never pass this sentinel through firestoreSafe — it would be
      // flattened into a plain object and stored as garbage.
      payload.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
      fbFS.doc('ledger/'+uid).set(payload).then(()=>{setSyncError(false);setSyncErrorMsg("");setLastSyncedAt(Date.now())}).catch(e=>{console.warn("Sync push failed:",e);setSyncError(true);setSyncErrorMsg(String(e&&e.message||e))});
    }catch(e){console.warn("Sync push failed:",e);setSyncError(true);setSyncErrorMsg(String(e&&e.message||e))}
  },[]);

  /* Snapshot-driven pushes (repair/seed paths) go through a cooldown so that no
     feedback loop between devices can ever firehose Firestore writes. */
  const lastSyncPushRef=useRef(0);
  const safePushSync=useCallback(uid=>{
    const now=Date.now();
    if(now-lastSyncPushRef.current<3000)return;
    lastSyncPushRef.current=now;
    pushSync(uid);
  },[pushSync]);

  /* Listen for auth changes — sign-in/out drives the whole sync loop. */
  useEffect(()=>{
    if(!FIREBASE_CONFIGURED)return;
    if(!fbInit())return;
    const unsub=fbAuth.onAuthStateChanged(user=>{
      setAuthUser(user?{uid:user.uid,name:user.displayName,email:user.email,photo:user.photoURL}:null);
      if(!user){setSyncError(false);setSyncErrorMsg("")}
    });
    return ()=>unsub();
  },[]);

  /* Watch the cloud copy: newer remote data wins; missing/older docs get seeded from local. */
  useEffect(()=>{
    if(!FIREBASE_CONFIGURED||!authUser||!fbInit())return;
    const uid=authUser.uid;
    let unsub=null;
    try{
      unsub=fbFS.doc('ledger/'+uid).onSnapshot(snap=>{
        if(snap.exists){ // `exists` is a boolean property on DocumentSnapshot (v9+), not a method
          const data=snap.data();
          const last=getLastSync(uid);
          const local=stateRef.current||{};
          const localHasData=!!local.settings||(Array.isArray(local.expenses)&&local.expenses.length>0)||(Array.isArray(local.topUps)&&local.topUps.length>0);
          const cloudLooksDefault=!(Array.isArray(data.expenses)&&data.expenses.length>0)&&!(Array.isArray(data.topUps)&&data.topUps.length>0)&&!data.settings;
          const at=data.updatedAt;
          // Support both server timestamps and the old numeric format.
          const remoteAt=at&&typeof at.toMillis==='function'?at.toMillis():(typeof at==='number'?at:0);
          if(remoteAt>last){
            if(cloudLooksDefault&&localHasData){
              // The cloud copy is an empty/default state (e.g. seeded before setup).
              // Never let it replace real local data — push the real copy up instead.
              pushSync(uid);
            }else{
              skipNextPushRef.current=true; // don't echo what we just applied back to the cloud
              applyRemote(data);
              setLastSync(uid,remoteAt);
              setLastSyncedAt(remoteAt);
              if(last===0)showToast("Synced from cloud.","success"); // announce the first pull only, not our own echoes
            }
          }else if(remoteAt===0){
            // Unreadable timestamp — docs written by an earlier buggy build stored
            // a plain object instead of a server timestamp. Preserve whatever data
            // exists: pull real cloud data if this device is fresh, otherwise
            // re-save this device's copy with a proper timestamp.
            if(cloudLooksDefault||localHasData){safePushSync(uid)}
            else{skipNextPushRef.current=true;applyRemote(data)}
          }else if(remoteAt<last){
            safePushSync(uid); // cloud copy is older — restore it from this device
          }
        }else{
          safePushSync(uid); // first time on this account — seed the cloud with local data
        }
        syncedRef.current=uid;
      },e=>{console.warn("Sync listener error:",e);setSyncError(true);setSyncErrorMsg(String(e&&e.message||e))});
    }catch(e){console.warn("Sync subscribe failed:",e);setSyncError(true);setSyncErrorMsg(String(e&&e.message||e))}
    return ()=>{if(unsub)unsub()};
  },[authUser,applyRemote,pushSync,safePushSync,showToast]);

  /* Debounced push whenever any synced slice changes locally. */
  useEffect(()=>{
    if(skipNextPushRef.current){skipNextPushRef.current=false;return}
    if(!FIREBASE_CONFIGURED||!authUser||syncedRef.current!==authUser.uid)return;
    if(pushTimerRef.current)clearTimeout(pushTimerRef.current);
    pushTimerRef.current=setTimeout(()=>pushSync(authUser.uid),1500);
    return ()=>clearTimeout(pushTimerRef.current);
  },[expenses,topUps,balance,piggy,recurring,settings,categories,catBudgets,prefs,theme,authUser,pushSync]);

  const signInGoogle=async()=>{
    if(!FIREBASE_CONFIGURED){showToast("Sync isn't configured yet — see the Sync section in settings.","error");return}
    if(!fbInit()){showToast("Couldn't load Firebase — check your internet connection and reload.","error");return}
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      await fbAuth.signInWithPopup(provider);
      showToast("Signed in — syncing is on. Change something to push your data.","success");
    }catch(err){
      const code=err&&err.code;
      if(code==='auth/popup-closed-by-user'){
        showToast("Sign-in cancelled.","info");
      }else if(code==='auth/popup-blocked'||code==='auth/cancelled-popup-request'){
        showToast("Popup blocked — allow popups for this page and try again.","error");
      }else if(code==='auth/unauthorized-domain'){
        showToast("This domain isn't authorized — add it in Firebase console → Authentication → Settings → Authorized domains.","error");
      }else if(code==='auth/operation-not-supported-in-this-environment'){
        showToast("Google sign-in needs http(s) hosting — serve this file from a local server or a host.","error");
      }else{
        showToast(err&&err.message?err.message:"Sign-in failed.","error");
      }
    }
  };
  const signOutGoogle=async()=>{
    try{await fbAuth.signOut();showToast("Signed out. Changes stay on this device.","info")}
    catch(e){showToast("Sign out failed.","error")}
  };

  /* ─── Setup ─── */
  const saveSetup=()=>{
    const budget=parseFloat(draftBudget);
    const days=parseInt(draftDays,10);
    if(!isFinite(budget)||budget<0||!days||days<=0){showToast("Enter a valid amount and period.","error");return}
    let bal=null;
    if(balancesOn){
      bal=draftBalance.trim()===''?null:parseFloat(draftBalance);
      if(bal!==null&&(!isFinite(bal)||bal<0)){showToast("Enter a valid balance.","error");return}
    }
    persistSettings({monthlyBudget:budget,periodDays:days,startDate:draftStartDate||firstOfMonthKey()});
    if(!settings)persistPrefs({...prefs,currency:draftCurrency});
    if(balancesOn){
      if(bal!==null)persistBalance({...balance,start:bal});
      else if(!settings)persistBalance({...balance,start:0});
    }
    setShowSetup(false);
    showToast(settings?"Budget updated.":"Budget saved. Start tracking!","success");
  };

  /* ─── Move money & balance ─── */
  const topUpTotal=useMemo(()=>topUps.reduce((s,t)=>s+t.amount,0),[topUps]);
  const effectiveMonthlyBudget=settings?settings.monthlyBudget+topUpTotal:0;
  const dailyBudget=settings?effectiveMonthlyBudget/settings.periodDays:0;

  /* ─── Derived data ─── */
  const spentByDay=useMemo(()=>{
    const m={};for(const e of expenses)m[e.date]=(m[e.date]||0)+e.amount;return m;
  },[expenses]);

  const{dayCells,elapsedDays,runningBalance}=useMemo(()=>{
    if(!settings)return{dayCells:[],elapsedDays:0,runningBalance:0};
    const elapsed=Math.min(Math.max(dayDiff(settings.startDate,today)+1,1),settings.periodDays);
    let running=0;const cells=[];
    for(let i=0;i<settings.periodDays;i++){
      const date=addDays(settings.startDate,i);
      const isFuture=i>=elapsed;
      const spent=spentByDay[date]||0;
      const delta=isFuture?0:dailyBudget-spent;
      if(!isFuture)running+=delta;
      cells.push({date,spent,delta,isFuture,isToday:date===today});
    }
    return{dayCells:cells,elapsedDays:elapsed,runningBalance:running};
  },[settings,spentByDay,today,dailyBudget]);

  const todaySpent=spentByDay[today]||0;
  const todayRemaining=dailyBudget-todaySpent;

  /* Bank balance = starting money, plus the leftover allowance banked at the end
     of each day, minus money moved over to the monthly budget. Leftovers use the
     allowance that was in effect on each day (top-ups dated after a day don't
     retroactively change it), so returning money to the balance feels exact. */
  const bankedSoFar=useMemo(()=>{
    if(!settings)return 0;
    const byDate={};
    for(const t of topUps)byDate[t.date]=(byDate[t.date]||0)+t.amount;
    let cum=0,banked=0;
    for(const c of dayCells){
      if(c.isFuture)break;
      cum+=(byDate[c.date]||0);
      const left=(settings.monthlyBudget+cum)/settings.periodDays-c.spent;
      if(left>0)banked+=left;
    }
    return banked;
  },[settings,topUps,dayCells]);
  const bankBalance=useMemo(()=>(balance?.start||0)-topUpTotal+bankedSoFar,[balance,topUpTotal,bankedSoFar]);
  const todaySaved=Math.max(0,todayRemaining);
  const heroLabel=heroMode==='balance'?"Balance":"Available today";
  const heroValue=heroMode==='balance'?bankBalance:todayRemaining;

  const addTopUp=()=>{
    const val=parseFloat(topUpAmount);
    if(!val||val<=0){showToast(balancesOn?"Enter a valid amount.":"Enter a valid top-up amount.","error");return}
    if(balancesOn&&val>bankBalance){showToast(`Not enough balance — move at most ${MYR(bankBalance)}.`,"error");return}
    const entry={id:uid(),amount:val,date:today,note:topUpNote.trim()};
    persistTopUps([...topUps,entry]);
    setTopUpAmount("");setTopUpNote("");setShowTopUp(false);
    showToast(balancesOn?`Moved ${MYR(val)} from your balance to this month's budget.`:`Topped up ${MYR(val)} — added to your monthly budget.`,"success");
  };
  const addToBalance=()=>{
    const val=parseFloat(topUpAmount);
    if(!val||val<=0){showToast("Enter a valid amount.","error");return}
    persistBalance({...balance,start:(balance?.start||0)+val});
    setTopUpAmount("");setTopUpNote("");setShowTopUp(false);
    showToast(`Added ${MYR(val)} to your balance.`,"success");
  };
  const returnToBalance=()=>{
    const val=parseFloat(topUpAmount);
    if(!val||val<=0){showToast("Enter a valid amount.","error");return}
    if(topUpTotal<=0){showToast("Nothing to return — you haven't moved money to the budget. Please move some first.","error");return}
    if(val>topUpTotal){showToast(`Can't return more than the ${MYR(topUpTotal)} you moved to the budget.`,"error");return}
    const entry={id:uid(),amount:-val,date:today,note:topUpNote.trim()};
    persistTopUps([...topUps,entry]);
    setTopUpAmount("");setTopUpNote("");setShowTopUp(false);
    showToast(`Returned ${MYR(val)} from your budget to your balance.`,"success");
  };
  const withdrawFromBalance=()=>{
    const val=parseFloat(topUpAmount);
    if(!val||val<=0){showToast("Enter a valid amount.","error");return}
    if(bankBalance<=0){showToast("Nothing to withdraw — your balance is empty. Move money into it first.","error");return}
    if(val>bankBalance){showToast(`Not enough balance — withdraw at most ${MYR(bankBalance)}.`,"error");return}
    persistBalance({...balance,start:(balance?.start||0)-val});
    setTopUpAmount("");setTopUpNote("");setShowTopUp(false);
    showToast(`Withdrew ${MYR(val)} from your balance.`,"success");
  };
  const submitMoney=()=>{
    if(moveMode==='budget')return addTopUp();
    if(moveMode==='return')return returnToBalance();
    if(moveMode==='withdraw')return withdrawFromBalance();
    return addToBalance();
  };
  const removeTopUp=id=>{
    const removed=topUps.find(t=>t.id===id);
    persistTopUps(topUps.filter(t=>t.id!==id));
    if(removed)showToast("Transfer removed.","info",{
      label:"Undo",run:()=>{persistTopUps([...topUps.filter(t=>t.id!==id),removed]);showToast("Restored.","success")}
    });
  };

  /* ─── Piggy bank ─── */

  /* ─── Automations (recurring entries) ─── */
  const runRecurring=(rules=recurring)=>{
    const ex=[...expenses],tu=[...topUps];
    let start=balance?.start||0;
    let changed=false;
    const next=rules.map(r=>{
      if(!r.active)return r;
      const from=r.last?addDays(r.last,1):(r.start||today);
      const cursor=new Date(from+"T00:00:00");
      const end=new Date(today+"T00:00:00");
      if(cursor>end)return r;
      const occ=[];
      let cur=cursor;
      while(cur<=end){occ.push(todayKey(cur));cur=advanceDate(cur,r.freq)}
      for(const d of occ){
        if(r.type==='expense')ex.push({id:uid(),date:d,amount:r.amount,category:r.category||'other',categories:[r.category||'other'],note:r.note?`${r.note} (auto)`:""});

        else start+=r.amount;
      }
      changed=true;
      return {...r,last:occ[occ.length-1]};
    });
    if(changed){
      persistExpenses(ex);persistTopUps(tu);persistBalance({...balance,start});persistRecurring(next);
      showToast("Automated entries added.","success");

  /* GitHub-style spending heatmap data (weeks as columns, Mon–Sun rows) */
  const heatColors={...HEAT_DEFAULT_COLORS,...(prefs.heatColors||{})};
  const heatData=useMemo(()=>{
    const end=new Date(today+'T00:00:00');

    const first=new Date(start);first.setDate(start.getDate()-((start.getDay()+6)%7)); // Monday on/before the range start
    const cells=[];let total=0,max=0;
    for(let d=new Date(first);d<=end;d.setDate(d.getDate()+1)){
      const date=todayKey(d);
      const spent=spentByDay[date]||0;
      total+=spent;if(spent>max)max=spent;
      cells.push({date,spent});
    }

    return{
      weeks:Math.ceil(cells.length/7),
      total,
      cells:cells.map(c=>({...c,level:c.spent===0?0:Math.min(4,Math.max(1,Math.ceil((c.spent/top)*4)))})),

      if(!el)return;

                    const path=pts.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
                    if(s.id==="__total__"){
                      const area=`${path} L ${pts[pts.length-1].x} 140 L ${pts[0].x} 140 Z`;
                      return(
                        <g key={s.id}>
                          <path className="trend-area" d={area} style={{fill:s.color}}/>
                          <path className="trend-line" d={path} style={{stroke:s.color}} vectorEffect="non-scaling-stroke"/>
                        </g>
                      );

                    return <path key={s.id} className="trend-line" d={path} style={{stroke:s.color,strokeWidth:1.8}} vectorEffect="non-scaling-stroke"/>;

                  return(
                    <div key={i} className="trend-dot-marker" style={{left:`${xPct}%`,top:`${yPct}%`}}
                      onMouseEnter={()=>setTrendHover({day:d,idx:i})}
                      onMouseLeave={()=>setTrendHover(null)}/>
                  );

                    <div className="hero-stat-value" style={{color:runningBalance<0?'var(--negative)':'var(--positive)'}}>{MYR(Math.abs(runningBalance))}</div>
                    <div className="hero-stat-note">{runningBalance<0?"Spent over allowance":"Unspent allowance carries over"}</div>
                  </div>
                )}
                <div>
                  <div className="hero-stat-label">Avg / day</div>
                  <div className="hero-stat-value">{MYR(avgDailySpend)}</div>
                  <div className="hero-stat-note">
                    {avgDailySpend<=dailyBudget?"Under allowance":"Over allowance"}
                    {daysOver>0&&` · ${daysOver}d over`}
                  </div>
                </div>
                <div>
                  <div className="hero-stat-label">Projected total</div>
                  <div className="hero-stat-value" style={{color:projectedDelta<0?'var(--negative)':'var(--text)'}}>{MYR(projectedTotal)}</div>
                  <div className="hero-stat-note">
                    {projectedDelta<0?`${MYR(Math.abs(projectedDelta))} over if pace holds`:`${MYR(projectedDelta)} left if pace holds`}
                  </div>
                </div>
              </div>

              <div className="strip-wrap">
                <div className="strip-header">
                  <span className="strip-label">Daily spend · this period</span>
                  <span className="strip-progress">Day {elapsedDays} / {settings.periodDays}</span>
                </div>
                <div className="strip">
                  {dayCells.map(c=>{
                    const pct=c.isFuture?8:Math.max(8,Math.min(100,(c.spent/((dailyBudget||1)*1.6))*100));
                    let color=theme.borderStrong;
                    /* Warn as soon as 3 or less is left for the day; red only once well over. */
                    if(!c.isFuture)color=c.delta>3?theme.positive:c.delta>=-dailyBudget*0.4?theme.warning:theme.negative;
                    return(
                      <div key={c.date} className={`tick ${c.isToday?"today":""}`}
                        title={`${relativeDate(c.date,today)} · Spent ${MYR(c.spent)} · ${c.delta>=0?'Left':'Over'} ${MYR(Math.abs(c.delta))}`}
                        style={{height:`${pct}%`,background:color,opacity:c.isFuture?.35:1}}
                      />
                    );
                  })}
                </div>
                <div className="strip-legend">
                  <span><span className="legend-dot" style={{background:theme.positive}}/>Under</span>
                  <span><span className="legend-dot" style={{background:theme.warning}}/>Near</span>
                  <span><span className="legend-dot" style={{background:theme.negative}}/>Over</span>
                  <span><span className="legend-dot" style={{background:theme.accent}}/>Today</span>
                </div>
              </div>
            </div>

            {/* Cards — drag the grip, or use the arrows, to rearrange */}
            <div className="cards-stack">
              {cardOrder.map((id,idx)=>(
                <div key={id} className="card-wrap"
                  style={{order:idx,gridColumn:(id==='log'||id==='breakdown')?'span 1':'1 / -1'}}
                  draggable
                  onDragStart={handleCardDragStart(id)}
                  onDragOver={handleCardDragOver}
                  onDrop={handleCardDrop(id)}>
                  <div className="card-reorder-bar">
                    <span className="card-drag-handle" title="Drag to reorder"><I.Grip/></span>
                    <span className="card-reorder-name">{CARD_LABELS[id]}</span>
                    <span className="card-reorder-actions">
                      <button className="card-reorder-btn" onClick={()=>moveCard(id,-1)} disabled={idx===0} title="Move up" aria-label="Move up"><I.ChevronUp/></button>
                      <button className="card-reorder-btn" onClick={()=>moveCard(id,1)} disabled={idx===cardOrder.length-1} title="Move down" aria-label="Move down"><I.ChevronDown/></button>
                    </span>
                  </div>
                  {cardMap[id]}
                </div>
              ))}
            </div>
          </>
        )}

        {/* Edit Budget Drawer */}
        {showSetup&&settings&&(
          <>
            <div className="drawer-overlay" onClick={()=>setShowSetup(false)}/>
            <div className="drawer" style={{width:460}}>
              <div className="drawer-header">
                <span className="drawer-title">Budget settings</span>
                <button className="icon-btn" onClick={()=>setShowSetup(false)}><I.Close/></button>
              </div>
              <div className="drawer-body">
                <div className="setup-form">
                  <div>
                    <div className="field-label">Monthly budget</div>
                    <div className="currency-row">
                      <select className="input currency-select" value={cur} onChange={e=>persistPrefs({...prefs,currency:e.target.value})}>
                        {Object.values(CURRENCIES).map(c=><option key={c.code} value={c.code}>{c.symbol} {c.code}</option>)}
                      </select>
                      <input className="input mono" type="number" inputMode="decimal" value={draftBudget} onChange={e=>setDraftBudget(e.target.value)}/>
                    </div>
                  </div>
                  {balancesOn&&(
                    <div>
                      <div className="field-label">Bank balance</div>
                      <div className="currency-row">
                        <select className="input currency-select" value={cur} onChange={e=>persistPrefs({...prefs,currency:e.target.value})}>
                          {Object.values(CURRENCIES).map(c=><option key={c.code} value={c.code}>{c.symbol} {c.code}</option>)}
                        </select>
                        <input className="input mono" type="number" inputMode="decimal" value={draftBalance} onChange={e=>setDraftBalance(e.target.value)}/>
                      </div>
                      <div className="hero-stat-note" style={{fontSize:12}}>Your bank balance. Transfers to the budget come out of this; leftover allowance is banked back into it.</div>
                    </div>
                  )}
                  <div>
                    <div className="field-label">Period length (days)</div>
                    <input className="input mono" type="number" inputMode="numeric" value={draftDays} onChange={e=>setDraftDays(e.target.value)}/>
                  </div>
                  <div>
                    <div className="field-label">Start date</div>
                    <input className="input mono" type="date" value={draftStartDate} max={today} onChange={e=>setDraftStartDate(e.target.value)}/>
                    <button className="link-btn" style={{marginTop:8}} onClick={()=>setDraftStartDate(firstOfMonthKey())}>Realign to 1st of this month</button>
                  </div>
                </div>
              </div>
              <div className="drawer-footer" style={{display:'flex',gap:8}}>
                <button className="btn" style={{flex:1}} onClick={saveSetup}>Save changes</button>
                <button className="btn btn-ghost" onClick={()=>setShowSetup(false)}>Cancel</button>
              </div>
            </div>
          </>
        )}

        {/* Move Money / Top Up Drawer */}
        {showTopUp&&settings&&(
          <>
            <div className="drawer-overlay" onClick={()=>setShowTopUp(false)}/>
            <div className="drawer" style={{width:420}}>
              <div className="drawer-header">
                <span className="drawer-title">{balancesOn?<I.Wallet style={{width:15,height:15,verticalAlign:-2,marginRight:6}}/>:<I.Zap style={{width:15,height:15,verticalAlign:-2,marginRight:6}}/>}{balancesOn?'Money':'Top up budget'}</span>
                <button className="icon-btn" onClick={()=>setShowTopUp(false)}><I.Close/></button>
              </div>
              <div className="drawer-body">
                {balancesOn&&(
                  <>
                    <div className="drawer-tabs">
                      <button className={`drawer-tab ${moveMode==='budget'?'active':''}`} onClick={()=>setMoveMode('budget')}>To budget</button>
                      <button className={`drawer-tab ${moveMode==='return'?'active':''}`} onClick={()=>setMoveMode('return')}>To balance</button>
                      <button className={`drawer-tab ${moveMode==='add'?'active':''}`} onClick={()=>setMoveMode('add')}>Add balance</button>
                      <button className={`drawer-tab ${moveMode==='withdraw'?'active':''}`} onClick={()=>setMoveMode('withdraw')}>Withdraw balance</button>
                    </div>
                    <div className="totals-row" style={{marginTop:14}}>
                      <span className="totals-label">Balance</span>
                      <span className="totals-value mono">{MYR(bankBalance)}</span>
                    </div>
                    <div className="totals-row">
                      <span className="totals-label">After</span>
                      <span className="totals-value mono">
                        {MYR((moveMode==='return'||moveMode==='add')
                          ? bankBalance+(parseFloat(topUpAmount)||0)
                          : bankBalance-(parseFloat(topUpAmount)||0))}
                      </span>
                    </div>
                  </>
                )}
                <div className="setup-form" style={{marginTop:balancesOn?14:0}}>
                  <div>
                    <div className="field-label">{!balancesOn?'Amount to add':moveMode==='budget'?"Amount to move to budget":moveMode==='return'?"Amount to return to balance":moveMode==='withdraw'?"Amount to withdraw":"Amount to add"}</div>
                    <div className="currency-row">
                      <select className="input currency-select" value={cur} disabled>
                        <option>{CURRENCIES[cur]?.symbol||cur}</option>
                      </select>
                      <input className="input mono" type="number" inputMode="decimal" placeholder="50" value={topUpAmount} onChange={e=>setTopUpAmount(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitMoney()} autoFocus/>
                    </div>
                  </div>
                  {(!balancesOn||moveMode==='budget'||moveMode==='return')&&(
                    <div>
                      <div className="field-label">Note (optional)</div>
                      <input className="input" type="text" placeholder={!balancesOn?"e.g. bonus, birthday money":moveMode==='return'?"e.g. took out the extra food money":"e.g. extra cash for food"} value={topUpNote} onChange={e=>setTopUpNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitMoney()}/>
                    </div>
                  )}
                  <div className="hero-stat-note" style={{fontSize:12}}>
                    {!balancesOn
                      ? "Added to your total monthly budget — your daily allowance rises for the rest of the period."
                      : moveMode==='budget'
                        ? "Moved out of your balance into this month's budget — your daily allowance rises for the rest of the period."
                        : moveMode==='return'
                          ? "Moves money from your budget back to your balance — you can only take back what you moved in."
                          : moveMode==='withdraw'
                            ? "Removes money from your balance, e.g. to spend it elsewhere — it stays gone even if you stay under budget."
                            : "Money you add from outside the app — it raises your balance and is protected from spending."}
                  </div>
                </div>
                {(!balancesOn||moveMode==='budget'||moveMode==='return')&&topUps.length>0&&(
                  <div style={{marginTop:20}}>
                    <div className="field-label" style={{marginBottom:8}}>Recent {balancesOn?'transfers':'top-ups'}</div>
                    <div className="tx-list">
                      {[...topUps].reverse().slice(0,8).map(t=>(
                        <div className="tx-row" key={t.id} style={{'--cat-color':t.amount<0?'var(--warning)':'var(--positive)'}}>
                          <span className="tx-glyph">{t.amount>=0?(balancesOn?<I.Wallet style={{width:14,height:14}}/>:<I.Zap style={{width:14,height:14}}/>):<I.Wallet style={{width:14,height:14}}/>}</span>
                          <div className="tx-main">
                            <div className="tx-cat">{t.amount>=0?MYR(t.amount):'-'+MYR(Math.abs(t.amount))}</div>
                            {t.note&&<div className="tx-note">{t.note}</div>}
                          </div>
                          <span className="tx-date">{relativeDate(t.date,today)}</span>
                          <div className="tx-actions">
                            <button className="tx-action-btn danger" onClick={()=>removeTopUp(t.id)} title="Remove"><I.Trash/></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              <div className="drawer-footer" style={{display:'flex',gap:8}}>
                <button className="btn" style={{flex:1}} onClick={submitMoney}>
                  <I.Plus/> {!balancesOn?'Add funds':moveMode==='budget'?'Move to budget':moveMode==='return'?'Return to balance':moveMode==='withdraw'?'Withdraw':'Add to balance'}
                </button>
                <button className="btn btn-ghost" onClick={()=>setShowTopUp(false)}>Cancel</button>
              </div>
            </div>
          </>
        )}

        {/* Theme Drawer */}
        {showDrawer&&(
          <>
            <div className="drawer-overlay" onClick={()=>setShowDrawer(false)}/>
            <div className="drawer">
              <div className="drawer-header">
                <span className="drawer-title">Customize</span>
                <button className="icon-btn" onClick={()=>setShowDrawer(false)}><I.Close/></button>
              </div>
              <div className="drawer-body">
                <div className="drawer-tabs">
                  <button className={`drawer-tab ${drawerTab==='theme'?'active':''}`} onClick={()=>setDrawerTab('theme')}>Theme</button>
                  <button className={`drawer-tab ${drawerTab==='chart'?'active':''}`} onClick={()=>setDrawerTab('chart')}>Chart</button>
                  <button className={`drawer-tab ${drawerTab==='cats'?'active':''}`} onClick={()=>setDrawerTab('cats')}>Categories</button>
                  <button className={`drawer-tab ${drawerTab==='prefs'?'active':''}`} onClick={()=>setDrawerTab('prefs')}>Prefs</button>
                </div>

                {drawerTab==='theme'&&(
                  <>
                    <div className="section-title">Wallpaper (Local)</div>
                    {prefs.wallpaper?(
                      <>
                        <div className={`wallpaper-preview ${prefs.wallBlur>0?'blurred':''}`} style={isVideoWallpaper?{}:{backgroundImage:`url(${prefs.wallpaper})`}}>
                          {isVideoWallpaper&&<video className="wallpaper-video" src={prefs.wallpaper} autoPlay loop muted playsInline/>}
                          <div className="wallpaper-preview-scrim" style={{background:theme.bg,opacity:prefs.wallpaperDim/100}}/>
                        </div>
                        <div className="slider-row">
                          <div className="slider-header">
                            <span className="slider-label">Background dim</span>
                            <span className="slider-value">{prefs.wallpaperDim}%</span>
                          </div>
                          <input className="slider" type="range" min="0" max="90" step="5" value={prefs.wallpaperDim} onChange={e=>persistPrefs({...prefs,wallpaperDim:parseInt(e.target.value)})}/>
                        </div>
                        <div className="backup-grid" style={{marginTop:8}}>
                          <button className="btn btn-secondary" onClick={triggerWallpaperUpload}><I.Upload/> Replace</button>
                          <button className="btn btn-ghost" onClick={clearWallpaper}><I.Trash/> Remove</button>
                        </div>
                      </>
                    ):(
                      <>
                        <button className="btn btn-secondary btn-block" onClick={triggerWallpaperUpload}><I.Upload/> Upload a photo or video</button>
                        <div className="section-desc" style={{marginTop:8}}>Static images or short looping video clips (MP4/WebM). Large files may not survive a reload due to browser storage limits.</div>
                      </>
                    )}

                    <div className="section-title">Weather effects</div>
                    <div className="drawer-tabs">
                      {[['none','None'],['rain','Rain'],['snow','Snow']].map(([id,label])=>(
                        <button key={id} className={`drawer-tab ${prefs.weather===id?'active':''}`} onClick={()=>persistPrefs({...prefs,weather:id})}>{label}</button>
                      ))}
                    </div>
                    {prefs.weather!=='none'&&(
                      <div className="slider-row">
                        <div className="slider-header">
                          <span className="slider-label">Effect speed</span>
                          <span className="slider-value">{(prefs.weatherSpeed||1).toFixed(2)}×</span>
                        </div>
                        <input className="slider" type="range" min="0.1" max="3" step="0.1" value={prefs.weatherSpeed||1} onChange={e=>persistPrefs({...prefs,weatherSpeed:parseFloat(e.target.value)})}/>
                      </div>
                    )}

                    <div className="section-title">Glass & transparency</div>
                    <div className="slider-row">
                      <div className="slider-header">
                        <span className="slider-label">UI blur</span>
                        <span className="slider-value">{prefs.uiBlur}px</span>
                      </div>
                      <input className="slider" type="range" min="0" max="32" step="2" value={prefs.uiBlur} onChange={e=>persistPrefs({...prefs,uiBlur:parseInt(e.target.value)})}/>
                    </div>
                    <div className="slider-row">
                      <div className="slider-header">
                        <span className="slider-label">UI transparency</span>
                        <span className="slider-value">{prefs.uiOpacity}%</span>
                      </div>
                      <input className="slider" type="range" min="0" max="100" step="5" value={prefs.uiOpacity} onChange={e=>persistPrefs({...prefs,uiOpacity:parseInt(e.target.value)})}/>
                    </div>
                    {prefs.wallpaper&&(
                      <div className="slider-row">
                        <div className="slider-header">
                          <span className="slider-label">Background blur</span>
                          <span className="slider-value">{prefs.wallBlur}px</span>
                        </div>
                        <input className="slider" type="range" min="0" max="40" step="2" value={prefs.wallBlur} onChange={e=>persistPrefs({...prefs,wallBlur:parseInt(e.target.value)})}/>
                      </div>
                    )}

                    <div className="section-title">Presets</div>
                    <div className="theme-preset-grid">
                      {Object.entries(PRESETS).map(([key,p])=>(
                        <button key={key} className={`theme-preset ${activePresetKey===key?"active":""}`} onClick={()=>applyPreset(key)}>
                          <div className="theme-preset-swatch">
                            <span style={{background:p.bg}}/><span style={{background:p.surface}}/><span style={{background:p.accent}}/>
                          </div>
                          <div className="theme-preset-name">{p.name}</div>
                        </button>
                      ))}
                    </div>

                    <div className="section-title">Interface</div>
                    {[['bg','Background'],['surface','Surface'],['accent','Accent'],['accentFg','Accent text'],['text','Text']].map(([k,l])=>(
                      <div className="color-row" key={k}>
                        <span className="color-row-label">{l}</span>
                        <span style={{display:'flex',alignItems:'center',gap:8}}>
                          <span className="color-hex">{theme[k]}</span>
                          <input className="color-input" type="color" value={theme[k]} onChange={e=>updateColor(k,e.target.value)}/>
                        </span>
                      </div>
                    ))}

                    <div className="section-title">Status</div>
                    {[['positive','Positive / Under'],['warning','Warning / Near'],['negative','Negative / Over']].map(([k,l])=>(
                      <div className="color-row" key={k}>
                        <span className="color-row-label">{l}</span>
                        <span style={{display:'flex',alignItems:'center',gap:8}}>
                          <span className="color-hex">{theme[k]}</span>
                          <input className="color-input" type="color" value={theme[k]} onChange={e=>updateColor(k,e.target.value)}/>
                        </span>
                      </div>
                    ))}

                    <div className="section-title">Typography</div>
                    <div className="font-option-grid">
                      {allFontOptions.map(f=>(
                        <button key={f.id} className={`font-option ${prefs.font===f.id?'active':''}`} onClick={()=>persistPrefs({...prefs,font:f.id})}>
                          <div className="font-option-sample" style={{fontFamily:f.stack}}>Aa</div>
                          <div className="font-option-name">
                            {f.name}
                            {f.id.startsWith('custom:')&&(
                              <span className="font-option-remove" onClick={ev=>{ev.stopPropagation();removeCustomFont(f.id)}} title="Remove font">✕</span>
                            )}
                          </div>
                        </button>
                      ))}
                    </div>
                    <div className="add-font-row">
                      <input className="input" placeholder="Any Google Font, e.g. Bebas Neue" value={draftFontName}
                        onChange={e=>setDraftFontName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustomFont()}/>
                      <button className="btn btn-secondary" onClick={addCustomFont}><I.Plus/> Add</button>
                    </div>
                    <div className="section-desc" style={{marginTop:-4,marginBottom:4}}>Type any font name from fonts.google.com — it loads instantly and is remembered.</div>

                    <div className="section-title">Card panels</div>
                    <div className="section-desc" style={{marginTop:-4}}>Skin every card with your own image — like a nameplate or sign texture wrapping the whole card.</div>
                    {prefs.cardPanel?(
                      <>
                        <div className="wallpaper-preview">
                          <div style={{position:'absolute',inset:0,backgroundImage:`url(${prefs.cardPanel})`,backgroundSize:'cover',backgroundPosition:'center'}}/>
                        </div>
                        <div className="slider-row">
                          <div className="slider-header">
                            <span className="slider-label">Panel strength</span>
                            <span className="slider-value">{prefs.cardPanelOpacity}%</span>
                          </div>
                          <input className="slider" type="range" min="10" max="100" step="5" value={prefs.cardPanelOpacity} onChange={e=>persistPrefs({...prefs,cardPanelOpacity:parseInt(e.target.value)})}/>
                        </div>
                        <div className="backup-grid" style={{marginTop:8}}>
                          <button className="btn btn-secondary" onClick={triggerCardPanelUpload}><I.Upload/> Replace</button>
                          <button className="btn btn-ghost" onClick={clearCardPanel}><I.Trash/> Remove</button>
                        </div>
                      </>
                    ):(
                      <div className="backup-grid">
                        <button className="btn btn-secondary btn-block" onClick={triggerCardPanelUpload}><I.Upload/> Upload an image</button>
                      </div>
                    )}
                    <input ref={cardPanelInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleCardPanelFile}/>

                    <div className="section-title">Card layout</div>
                    <div className="section-desc" style={{marginTop:-4}}>Drag the grip, or use the arrow buttons, on any card to rearrange the order.</div>
                    <button className="btn btn-ghost btn-block" onClick={resetCardOrder}>Reset card order</button>

                    <div className="section-title">Desktop cat</div>
                    <div className="toggle-row">
                      <div>
                        <div className="toggle-label">Show desktop cat</div>
                        <div className="toggle-desc">A little cat that chases your cursor.</div>
                      </div>
                      <button className={`toggle ${prefs.catEnabled?'on':''}`} onClick={()=>persistPrefs({...prefs,catEnabled:!prefs.catEnabled})}/>
                    </div>
                    {prefs.catEnabled&&(
                      <div className="cat-color-grid">
                        {CAT_COLOR_PRESETS.map((c,i)=>(
                          <button
                            key={c||'classic'}
                            className={`cat-color-swatch ${c===null?'classic':''} ${prefs.catColor===c?'active':''}`}
                            style={c?{background:c}:{}}
                            title={c||'Classic'}
                            onClick={()=>persistPrefs({...prefs,catColor:c})}
                          />
                        ))}
                        <label className="cat-color-swatch-custom" title="Custom color">
                          <input type="color" value={prefs.catColor||'#ffffff'} onChange={e=>persistPrefs({...prefs,catColor:e.target.value})}/>
                        </label>
                      </div>
                    )}
                  </>
                )}

                {drawerTab==='chart'&&(
                  <>
                    <div className="section-title">Preview</div>
                    <div className="pie-preview">
                      <svg viewBox="0 0 36 36" style={{transform:'rotate(-90deg)'}}>
                        <circle cx="18" cy="18" r="15.9155" fill="none" stroke={theme.border} strokeWidth={prefs.pieThickness}/>
                        {(()=>{
                          const preview=cats.slice(0,4).map((c,i)=>({...c,pct:[35,25,25,15][i]||10}));
                          let off=0;
                          return preview.map(s=>{
                            const gap=prefs.pieGap*0.3;
                            const dash=Math.max(0.1,s.pct-gap);
                            const el=<circle key={s.id} cx="18" cy="18" r="15.9155" fill="none" stroke={s.color} strokeWidth={prefs.pieThickness} strokeDasharray={`${dash} ${100-dash}`} strokeDashoffset={25-off}/>;
                            off+=s.pct;return el;
                          });
                        })()}
                      </svg>
                    </div>
                    <div className="slider-row">
                      <div className="slider-header">
                        <span className="slider-label">Ring thickness</span>
                        <span className="slider-value">{prefs.pieThickness.toFixed(1)}</span>
                      </div>
                      <input className="slider" type="range" min="1" max="8" step="0.2" value={prefs.pieThickness} onChange={e=>persistPrefs({...prefs,pieThickness:parseFloat(e.target.value)})}/>
                    </div>
                    <div className="slider-row">
                      <div className="slider-header">
                        <span className="slider-label">Segment gap</span>
                        <span className="slider-value">{prefs.pieGap.toFixed(1)}</span>
                      </div>
                      <input className="slider" type="range" min="0" max="4" step="0.2" value={prefs.pieGap} onChange={e=>persistPrefs({...prefs,pieGap:parseFloat(e.target.value)})}/>
                    </div>

                    <div className="section-title">Trend style</div>
                    <div className="drawer-tabs">
                      {[['line','Line chart'],['heatmap','Heatmap']].map(([id,label])=>(
                        <button key={id} className={`drawer-tab ${prefs.trendStyle===id?'active':''}`} onClick={()=>persistPrefs({...prefs,trendStyle:id})}>{label}</button>
                      ))}
                    </div>

/* If a render ever throws (e.g. from a bad synced copy), show a recoverable
   screen instead of a black/blank page. */
class LedgerErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  componentDidCatch(err,info){console.error("Ledger crashed:",err,info)}
  render(){
    if(this.state.err){
      const btn={fontFamily:'inherit',fontSize:13,fontWeight:600,padding:'9px 14px',borderRadius:8,border:'none',cursor:'pointer',color:'#0b0d10',background:'#e8e8e8',marginRight:8};
      return(
        <div style={{maxWidth:520,margin:'80px auto',padding:28,fontFamily:"system-ui,-apple-system,sans-serif",color:'#e8e8e8',background:'#0b0d10',borderRadius:14}}>
          <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Something went wrong</div>
          <div style={{fontSize:13,color:'#9a9a9a',marginBottom:14}}>Usually caused by a corrupt synced copy — reloading usually fixes it. If it keeps happening, reset local data (your cloud copy is preserved).</div>
          <code style={{display:'block',fontSize:11,color:'#f88',marginBottom:18,wordBreak:'break-word'}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</code>
          <button style={btn} onClick={()=>location.reload()}>Reload</button>
          <button style={{...btn,background:'#c0392b',color:'#fff'}} onClick={()=>{Object.keys(localStorage).filter(k=>k.startsWith('ledger-')).forEach(k=>localStorage.removeItem(k));location.reload()}}>Reset local data &amp; reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<LedgerErrorBoundary><App/></LedgerErrorBoundary>);

<script>
// Typewriter tab-title animation
(function(){
  const messages=["Ledger","Track every ringgit.","Stay on budget.","Simple. Private. Yours.","Log a spend →"];
  const baseTitle=document.title;
  let msgIndex=0,charIndex=0,deleting=false,running=false,timer=null;

  function schedule(fn,delay){timer=setTimeout(fn,delay)}

  function tick(){
    const current=messages[msgIndex];
    if(!deleting){
      charIndex++;
      document.title=current.slice(0,charIndex)+"▍";
      if(charIndex>=current.length){deleting=true;schedule(tick,1100);return}
      schedule(tick,85+Math.random()*45);
    }else{
      charIndex--;
      document.title=(current.slice(0,charIndex)||"")+"▍";
      if(charIndex<=0){
        deleting=false;
        msgIndex=(msgIndex+1)%messages.length;
        schedule(tick,350);
        return;
      }
      schedule(tick,35+Math.random()*20);
    }
  }

  function start(){
    if(running)return;
    running=true;
    charIndex=0;deleting=false;
    tick();
  }
  function stop(){
    running=false;
    clearTimeout(timer);
  }

  document.addEventListener("visibilitychange",function(){
    if(document.hidden){
      stop();
      document.title="👋 come back?";
    }else{
      document.title=baseTitle;
      start();
    }
  });

  if(!document.hidden)start();
})();
</script>

  /* Read live prefs from the app (persisted in localStorage under "ledger-prefs"). */
  function readAppPrefs() {
    try {
      const raw = localStorage.getItem("ledger-prefs");
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  const initialPrefs = readAppPrefs();
  let catEnabled = initialPrefs.catEnabled !== false;
  let currentColor = initialPrefs.catColor || null;
  let lastSpriteName = "idle";
  let lastSpriteFrame = 0;

  const nekoEl = document.createElement("div");
  const spriteEl = document.createElement("div");
  const overlayEl = document.createElement("div");

  /* Dark colors get inverted (white) outlines so the cat stays visible on dark
     backgrounds; light colors keep the classic black outlines. */
  function colorIsDark(hex) {
    let h = String(hex || "").replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return false;
    const n = parseInt(h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
  }

  function applyColorMode() {
    if (currentColor) {
      overlayEl.style.display = "block";
      overlayEl.style.backgroundColor = currentColor;
      const dark = colorIsDark(currentColor);
      spriteEl.style.filter = dark ? "invert(1)" : "none";
      overlayEl.style.mixBlendMode = dark ? "screen" : "multiply";
    } else {
      overlayEl.style.display = "none";
      spriteEl.style.filter = "none";
    }
  }

  function init() {
    nekoEl.id = "oneko";
    nekoEl.ariaHidden = true;
    nekoEl.style.width = "32px";
    nekoEl.style.height = "32px";
    nekoEl.style.position = "fixed";
    nekoEl.style.pointerEvents = "none";
    nekoEl.style.imageRendering = "pixelated";
    nekoEl.style.left = `${nekoPosX - 16}px`;
    nekoEl.style.top = `${nekoPosY - 16}px`;
    nekoEl.style.zIndex = 2147483647;
    nekoEl.style.display = catEnabled ? "" : "none";
    nekoEl.style.isolation = "isolate";               // keeps blending confined to this element

    spriteEl.style.position = "absolute";              // plain sprite layer (black lines intact)
    spriteEl.style.inset = "0";
    spriteEl.style.pointerEvents = "none";
    spriteEl.style.imageRendering = "pixelated";
    spriteEl.style.backgroundImage = `url(${nekoFile})`;
    spriteEl.style.backgroundRepeat = "no-repeat";

    overlayEl.style.position = "absolute";             // tint overlay, masked to the same sprite
    overlayEl.style.inset = "0";
    overlayEl.style.pointerEvents = "none";
    overlayEl.style.mixBlendMode = "multiply";
    overlayEl.style.webkitMaskImage = `url(${nekoFile})`;
    overlayEl.style.maskImage = `url(${nekoFile})`;
    overlayEl.style.webkitMaskRepeat = "no-repeat";
    overlayEl.style.maskRepeat = "no-repeat";

    applyColorMode();
    nekoEl.appendChild(spriteEl);
    nekoEl.appendChild(overlayEl);
    document.body.appendChild(nekoEl);

    document.addEventListener("mousemove", function (event) {
      mousePosX = event.clientX;
      mousePosY = event.clientY;
    });

    // Live-sync with the app's customization drawer (color / show-hide) without a reload.
    window.addEventListener("ledger:prefs", function (e) {
      const p = e.detail || {};
      const newEnabled = p.catEnabled !== false;
      const newColor = p.catColor || null;
      if (newEnabled !== catEnabled) {
        catEnabled = newEnabled;
        nekoEl.style.display = catEnabled ? "" : "none";
      }
      if (newColor !== currentColor) {
        currentColor = newColor;
        applyColorMode();
        setSprite(lastSpriteName, lastSpriteFrame);
      }
    });

    window.requestAnimationFrame(onAnimationFrame);
  }

  let lastFrameTimestamp;

  function onAnimationFrame(timestamp) {
    if (!nekoEl.isConnected) return;
    if (!lastFrameTimestamp) lastFrameTimestamp = timestamp;
    if (timestamp - lastFrameTimestamp > 100) {
      lastFrameTimestamp = timestamp;
      frame();
    }
    window.requestAnimationFrame(onAnimationFrame);
  }

  function setSprite(name, frame) {
    lastSpriteName = name;
    lastSpriteFrame = frame;
    const sprite = spriteSets[name][frame % spriteSets[name].length];
    const pos = `${sprite[0] * 32}px ${sprite[1] * 32}px`;
    spriteEl.style.backgroundPosition = pos;
    overlayEl.style.webkitMaskPosition = pos;  // keep overlay aligned to the same frame
    overlayEl.style.maskPosition = pos;
  }

  function resetIdleAnimation() {
    idleAnimation = null;
    idleAnimationFrame = 0;
  }

  function idle() {
    idleTime += 1;

    if (
      idleTime > 10 &&
      Math.floor(Math.random() * 200) === 0 &&
      idleAnimation === null
    ) {
      const availableIdleAnimations = ["sleeping", "scratchSelf"];
      if (nekoPosX < 32) {
        availableIdleAnimations.push("scratchWallW");
      }
      if (nekoPosY < 32) {
        availableIdleAnimations.push("scratchWallN");
      }
      if (nekoPosX > window.innerWidth - 32) {
        availableIdleAnimations.push("scratchWallE");
      }
      if (nekoPosY > window.innerHeight - 32) {
        availableIdleAnimations.push("scratchWallS");
      }
      idleAnimation =
        availableIdleAnimations[
          Math.floor(Math.random() * availableIdleAnimations.length)
        ];
    }

    switch (idleAnimation) {
      case "sleeping":
        if (idleAnimationFrame < 8) {
          setSprite("tired", 0);
          break;
        }
        setSprite("sleeping", Math.floor(idleAnimationFrame / 4));
        if (idleAnimationFrame > 192) {
          resetIdleAnimation();
        }
        break;
      case "scratchWallN":
      case "scratchWallS":
      case "scratchWallE":
      case "scratchWallW":
      case "scratchSelf":
        setSprite(idleAnimation, idleAnimationFrame);
        if (idleAnimationFrame > 9) {
          resetIdleAnimation();
        }
        break;
      default:
        setSprite("idle", 0);
        return;
    }
    idleAnimationFrame += 1;
  }

  function frame() {
    frameCount += 1;
    const diffX = nekoPosX - mousePosX;
    const diffY = nekoPosY - mousePosY;
    const distance = Math.sqrt(diffX ** 2 + diffY ** 2);

    if (distance < nekoSpeed || distance < 48) {
      idle();
      return;
    }

    idleAnimation = null;
    idleAnimationFrame = 0;

    if (idleTime > 1) {
      setSprite("alert", 0);
      idleTime = Math.min(idleTime, 7);
      idleTime -= 1;
      return;
    }

    let direction = diffY / distance > 0.5 ? "N" : "";
    direction += diffY / distance < -0.5 ? "S" : "";
    direction += diffX / distance > 0.5 ? "W" : "";
    direction += diffX / distance < -0.5 ? "E" : "";
    setSprite(direction, frameCount);

    nekoPosX -= (diffX / distance) * nekoSpeed;
    nekoPosY -= (diffY / distance) * nekoSpeed;

    nekoPosX = Math.min(Math.max(16, nekoPosX), window.innerWidth - 16);
    nekoPosY = Math.min(Math.max(16, nekoPosY), window.innerHeight - 16);

    nekoEl.style.left = `${nekoPosX - 16}px`;
    nekoEl.style.top = `${nekoPosY - 16}px`;
  }

  init();
})();
</script>
